<text x="950" y="1180" font-size="26" font-weight="bold" text-anchor="middle" fill="#111">HNSW Structure: A multi-layered graph where search starts at the top (coarse) and</text>
<text x="950" y="1215" font-size="26" text-anchor="middle" fill="#111">greedily descends to the bottom (fine) to efficiently find nearest neighbors.</text>
