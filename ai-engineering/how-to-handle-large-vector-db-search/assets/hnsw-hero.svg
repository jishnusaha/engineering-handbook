<text x="1420" y="340" font-size="22" fill="#111">
  <tspan x="1420" dy="0">Higher Layers: Fewer nodes,</tspan>
  <tspan x="1420" dy="28">long-range connections for</tspan>
  <tspan x="1420" dy="28">fast, coarse navigation across</tspan>
  <tspan x="1420" dy="28">the graph.</tspan>
</text>
<text x="1420" y="770" font-size="22" fill="#111">
  <tspan x="1420" dy="0">Lower Layers: More nodes,</tspan>
  <tspan x="1420" dy="28">short-range connections for</tspan>
  <tspan x="1420" dy="28">fine-grained local search and</tspan>
  <tspan x="1420" dy="28">final refinement.</tspan>
</text>
